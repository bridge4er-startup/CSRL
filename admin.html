<!doctype html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>CSRL Admin</title><link rel="stylesheet" href="/styles.css" /><link rel="stylesheet" href="/src/admin.css" /></head><body class="admin-body"><main class="admin-shell"><a class="brand" href="/"><span><strong>CSRL</strong><small>Content administration</small></span></a><section id="login-panel" class="admin-card"><h1>Administrator sign in</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required /></label><label>Password<input name="password" type="password" autocomplete="current-password" required /></label><button class="button dark-button">Sign in</button><p class="admin-message"></p></form></section><section id="app-panel" hidden><div class="admin-top"><div><h1>Website content</h1><p>Save changes, then refresh the public site to review them.</p></div><button id="sign-out" class="button">Sign out</button></div><div class="admin-actions"><label>Section<select id="section-filter"><option value="home">Home</option><option value="news">News & publications</option><option value="research">Researches</option><option value="people">Contact personnel</option></select></label><button id="new-item" class="button dark-button">Add content</button><label class="upload-button">Upload image<input id="image-upload" type="file" accept="image/*" hidden /></label><span id="upload-result"></span></div><div class="admin-grid"><aside id="item-list"></aside><section id="editor" class="admin-card"><p>Select an item to edit it.</p></section></div></section></main><script type="module" src="/src/admin.js"></script></body></html>
